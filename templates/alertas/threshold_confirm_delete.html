{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-lg-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">Eliminar umbral</div>
            <div class="card-body">
                <p>¿Eliminar el umbral para <strong>{{ threshold.metric }}</strong>?</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'thresholds:threshold_list' %}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-danger">Eliminar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
